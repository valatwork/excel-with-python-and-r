name: Render R Markdown

on:
  push:
    paths:
      - '**/*.Rmd'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up R environment
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.0'  # Latest stable R version

    - name: Install R packages
      run: |
        Rscript -e 'install.packages(c("rmarkdown", "knitr", "readr", "ggplot2", "tidyverse", "dplyr", "readxl", "psych", "writexl", "gt", "tibble", "tidyquant", "purrr", "RDCOMClient", "janitor"))'

    - name: Render R Markdown files
      run: |
        Rscript -e 'rmarkdown::render_site()'

    - name: Commit and push rendered files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Render R Markdown files [skip ci]" || echo "No changes to commit"
        git push
